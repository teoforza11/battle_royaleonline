 case"hi":{LB.pl[from]={id:from,name:String(m.name||"Giocatore").slice(0,14),team:autoTeam()};lobbyChanged();break}

function joinRoom(){if(typeof Peer=="undefined")return errScr("Libreria di rete non caricata: serve una connessione internet.");
 const nm=(($("nm")&&$("nm").value)||"Giocatore").trim().slice(0,14)||"Giocatore",code=(($("jc")&&$("jc").value)||"").trim().toUpperCase();if(code.length<4)return toast("Inserisci il codice stanza");saveName(nm);netReset();

  setTimeout(()=>{if(!ok&&net===me){netReset();errScr("Stanza non trovata o irraggiungibile ("+esc(code)+").")}},12000);

 p.on("error",e=>{if(net===me){netReset();errScr(e.type=="peer-unavailable"?"Stanza non trovata: controlla il codice.":"Errore di rete: "+e.type)}})}
function clientRecv(m){switch(m.t){
 case"w":net.id=m.id;break;
 case"no":netReset();errScr(m.m);break;
 case"lobby":LB={N:m.N,pl:m.pl};if(m.back){clearGame();lobbyScreen()}else if(state=="lobby"||state=="menu")lobbyScreen();break;
 case"start":startGame(m);break;
 case"g":applyG(m);break;
 case"st":onSt(m);break;
 case"shot":onShot(m);break;
 case"hit":applyHit(m);break;
 case"kill":onKill(m);break;
 case"ev":evMsg(m.m);break;
 case"end":showEnd(m);break;
 case"left":{const p=PL[m.id];if(p){if(p.av)scene.remove(p.av.g);delete PL[m.id]}break}}}
// ---- lobby (solo l'host decide) ----
const cntT=t=>Object.values(LB.pl).filter(p=>p.team==t).length;
function autoTeam(){const c=[cntT(0),cntT(1)];if(c[0]<=c[1]&&c[0]<LB.N)return 0;if(c[1]<LB.N)return 1;if(c[0]<LB.N)return 0;return-1}
function lobbyChanged(){bcast({t:"lobby",N:LB.N,pl:LB.pl});if(state=="lobby")lobbyScreen()}
function setTeam(id,t){if(!net.host||!LB.pl[id])return;if(t>=0&&cntT(t)>=LB.N&&LB.pl[id].team!=t)return toast("Squadra piena ("+LB.N+" max)");LB.pl[id].team=t;lobbyChanged()}
function setN(n){if(!net.host)return;LB.N=n;for(let t=0;t<2;t++){let c=0;Object.values(LB.pl).forEach(p=>{if(p.team==t&&++c>n)p.team=-1})}lobbyChanged()}
function shuffleT(){if(!net.host)return;const a=Object.values(LB.pl).sort(()=>Math.random()-.5);a.forEach((p,i)=>p.team=-1);let c=[0,0];a.forEach((p,i)=>{const t=i%2;if(c[t]<LB.N){p.team=t;c[t]++}else if(c[1-t]<LB.N){p.team=1-t;c[1-t]++}});lobbyChanged()}
function kick(id){if(!net.host)return;const c=net.conns[id];if(c){c.send({t:"no",m:"Sei stato rimosso dalla stanza."});setTimeout(()=>{try{c.close()}catch(e){}},300)}dropPlayer(id)}
function canStart(){const a=cntT(0),b=cntT(1);return a>=1&&b>=1&&a<=LB.N&&b<=LB.N}
function startMatch(){if(!net.host||!canStart())return;const pl=Object.values(LB.pl).filter(p=>p.team>=0).map(p=>({id:p.id,name:p.name,team:p.team})),m={t:"start",N:LB.N,seed:Math.random()*1e9|0,pl};bcast(m);startGame(m)}
function startGame(m){clearGame();MP=buildMap(mkind(m.N),m.seed);zmesh.visible=false;kf=[];
 G={k:MP.k,N:m.N,tm:0,over:0,sc:[0,0],zs:MP.zones?MP.zones.map(()=>({v:0,o:-1})):[],fl:MP.k=="ctf"?[0,1,2,3].map(()=>({s:"home",by:-1,h:-1,x:0,y:0,z:0,t:0})):null};
 const mine=m.pl.find(q=>q.id==net.id);
 for(const q of m.pl){let p;if(q.id==net.id){p=P;Object.assign(P,{id:q.id,name:q.name,team:q.team,k:0,d:0,dead:0,hp:100,init:1})}
  else{p={id:q.id,name:q.name,team:q.team,k:0,d:0,dead:0,hp:100,x:0,y:0,z:0,yaw:0,pitch:0,w:0,c:0,init:0};p.av=mkAvatar(TM[q.team].c);p.av.g.visible=false;p.av.ms.forEach(mm=>mm.userData.pid=q.id);scene.add(p.av.g)}
  PL[q.id]=p}
 if(mine)for(const id in PL){const p=PL[id];if(p!==P&&p.team==P.team)p.av.g.add(nameTag(p.name,TM[p.team].h))}
 $("hud").style.display="block";$("dead").style.display="none";tm=0;paused=false;free=false;K.Tab=0;gT=0;stT=0;
 if(!mine){state="bench";scr(`<h1>🪑 Sei in panchina</h1><p>Non fai parte delle squadre di questa partita. Guarda e aspetta la fine: l’host vi riporterà in lobby.</p>`);$("hud").style.display="none";return}
 spawnMe();state="rules";ready=0;cnt=15;showRules()}
function showRules(){scr(`<h1>${MN[MP.k]}</h1><p>${RU[MP.k]}</p><p>La tua squadra: <b style="color:${TM[P.team].h}">${TM[P.team].n}</b> · Comandi: ${["f","l","b","r"].map(k=>"<b>"+kn(S.k[k])+"</b>").join(" ")} muoviti · Click sx spara · Click dx mira · 1-7 armi · <b>Tab</b> classifica</p><p id="cnt" class="k"></p><div class="row"><button class="b" id="rdy" onclick="rdy()">✔ Ho capito</button></div>`)}
function rdy(){ready=1;lock();$("rdy").style.display="none"}
function showEnd(m){if(state=="over")return;state="over";firing=false;ads=false;if(document.pointerLockElement)document.exitPointerLock();$("hud").style.display="none";$("dead").style.display="none";$("rt").style.display="none";
 const me=m.ks[net.id],played=!!me,win=m.w==P.team&&played,rw=played?reward(win,me[0]):0,H=net.host;
 const rows=t=>Object.values(m.ks).filter(r=>r[3]==t).sort((a,b)=>b[0]-a[0]).map(r=>`<div class="pr"><span>${esc(r[2])}</span><span>${r[0]} ☠ · ${r[1]} 💀</span></div>`).join("");
 scr(`<h1>${m.w<0?"🤝 PAREGGIO":"🏆 VINCE "+TM[m.w].n}</h1><p>${played?(win?"Avete vinto!":m.w<0?"Partita pari.":"Avete perso."):""}${played?`<br>💰 Ricompensa: <b>+${rw}</b> crediti · Totale: <b>${SH.cr}</b>`:""}</p>
 <div class="row" style="width:min(700px,100%)">${[0,1].map(t=>`<div class="tc" style="border-color:${TM[t].h}"><b style="color:${TM[t].h}">${TM[t].n}</b>${rows(t)}</div>`).join("")}</div>
 <div class="row">${H?`<button class="b" onclick="backToLobby()">↩ Torna alla lobby</button>`:`<p class="k">In attesa che l’host riapra la lobby…</p>`}<button onclick="leaveRoom()">Esci</button></div>`)}
function backToLobby(){if(!net.host)return;clearGame();state="lobby";bcast({t:"lobby",N:LB.N,pl:LB.pl,back:1});lobbyScreen()}
function leaveRoom(){netReset();clearGame();$("hud").style.display="none";if(document.pointerLockElement)document.exitPointerLock();mainMenu()}
// ---- schermate ----
function mainMenu(){state="menu";$("hud").style.display="none";if(document.pointerLockElement)document.exitPointerLock();
 scr(`<h1>🪂 BATTLE ARENA ONLINE</h1><p>Partite <b>private tra amici</b> (niente bot): crea una stanza, mandate il codice e scegliete voi le squadre. Da 1v1 a 6v6.</p>
 <input type="text" id="nm" maxlength="14" placeholder="Il tuo nome" value="${esc(myName())}">
 <div class="row"><button class="b" onclick="hostRoom()">🏠 Crea stanza privata</button></div>
 <div class="row"><input type="text" id="jc" maxlength="5" placeholder="CODICE" style="text-transform:uppercase;width:130px;text-align:center;letter-spacing:4px" oninput="this.value=this.value.toUpperCase()"><button onclick="joinRoom()">🔗 Entra con codice</button></div>
 <p class="k">🏟 1v1 Arena · 🚩 2v2 Conquista le Zone · 🏴 3v3-6v6 Cattura le Bandiere<br>Chi crea la stanza fa da server: deve restare nella partita finché dura.</p>
 <div class="row"><button onclick="shop()">🛒 Negozio · 💰 ${SH.cr}</button><button onclick="crates()">📦 Casse coltello</button><button onclick="settings('menu')">⚙ Impostazioni</button></div>`)}
function menu(){if(net.peer&&net.id>=0)lobbyScreen();else mainMenu()}
function lobbyScreen(){state="lobby";$("hud").style.display="none";const H=net.host,pl=Object.values(LB.pl);
 const col=t=>{const l=pl.filter(p=>p.team==t),h=t<0?"#777":TM[t].h;return`<div class="tc" style="border-color:${h}"><b style="color:${h}">${t<0?"Panchina":TM[t].n+" ("+l.length+"/"+LB.N+")"}</b>${l.map(p=>`<div class="pr"><span>${p.id==net.id?"⭐ ":""}${esc(p.name)}</span>${H?`<span>${[0,1,-1].filter(x=>x!=t).map(x=>`<button class="sm" onclick="setTeam(${p.id},${x})">${x<0?"⤓":"→ "+TM[x].n}</button>`).join("")}${p.id!=0?`<button class="sm" onclick="kick(${p.id})">✕</button>`:""}</span>`:""}</div>`).join("")}</div>`},
 ok=canStart(),k=mkind(LB.N);
 scr(`<h1>🔒 Stanza privata</h1><p>Codice stanza: <span class="code">${net.code}</span> <button class="sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${net.code}');toast('Codice copiato')">📋</button><br><span class="k">Mandalo ai tuoi amici: lo inseriscono in «Entra con codice».</span></p>
 <p><b>Modalità</b> ${H?"":"(decide l’host)"}</p><div class="grid" style="width:min(720px,100%)">${[1,2,3,4,5,6].map(n=>`<button class="${LB.N==n?"sel":""}" ${H?`onclick="setN(${n})"`:"disabled"}><span class="ic">${n}v${n}</span><small>${n==1?"🏟 Arena":n==2?"🚩 Zone":"🏴 Bandiere"}</small></button>`).join("")}</div>
 <p style="max-width:720px;background:#0005;border-radius:10px;padding:10px;text-align:left;font-size:14px">${RU[k]}</p>
 <div class="row" style="width:min(820px,100%);align-items:flex-start">${col(0)}${col(1)}${col(-1)}</div>
 <div class="row">${H?`<button onclick="shuffleT()">🔀 Mescola squadre</button><button class="b" ${ok?"":'disabled style="opacity:.4"'} onclick="startMatch()">▶ Avvia partita</button>`:`<p class="k">In attesa che l’host avvii la partita…</p>`}<button onclick="shop()">🛒 Mimetiche</button><button onclick="settings('menu')">⚙</button><button onclick="leaveRoom()">Esci</button></div>
 ${H&&!ok?`<p class="k">Servono almeno 1 giocatore per squadra (max ${LB.N} per squadra).</p>`:H&&cntT(0)!=cntT(1)?`<p class="k">⚠ Squadre non pari (${cntT(0)} vs ${cntT(1)}): puoi avviare lo stesso.</p>`:""}`)}
function pause(){paused=true;firing=false;ads=false;for(const k in K)K[k]=0;scr(`<h1>⏸ PAUSA</h1><p class="k">La partita continua!</p><div class="row"><button class="b" onclick="resume()">Continua</button><button onclick="settings('pause')">⚙ Impostazioni</button><button onclick="leaveRoom()">Esci dalla partita</button></div>`,"rgba(8,10,18,.55)")}
function resume(){paused=false;$("ov").style.display="none";$("ov").style.background="";lock()}
// ---- input ----
document.addEventListener("pointerlockchange",()=>{if(!document.pointerLockElement&&state=="play"&&!paused)pause()});
document.addEventListener("pointerlockerror",()=>{if(state=="play"&&!paused)pause()});
addEventListener("mousemove",e=>{if((state!="play"&&state!="rules")||paused||P.dead)return;if(document.pointerLockElement){yaw-=e.movementX*.0022*sk();pitch=cl(pitch-e.movementY*.0022*sk(),-1.45,1.45)}});
addEventListener("keydown",e=>{if(bind){e.preventDefault();if(e.code!="Escape"){S.k[bind]=e.code;sv()}bind=null;settings(back);return}
 if(e.target&&e.target.tagName=="INPUT")return;K[e.code]=1;
 if(state=="play"&&!paused&&!P.dead){if(/^Digit[1-7]$/.test(e.code))selectSlot(+e.code[5]-1);if(e.code==S.k.rl)reload()}
 if(e.code=="Space"||e.code=="Tab"||e.code.startsWith("Arrow"))e.preventDefault()});
addEventListener("keyup",e=>K[e.code]=0);addEventListener("blur",()=>{for(const k in K)K[k]=0;firing=false});
addEventListener("mousedown",e=>{if(state!="play"||paused||P.dead)return;if(e.button==0)firing=true;if(e.button==2){ads=true;$("cross").className="ads"}});
addEventListener("mouseup",e=>{if(e.button==0)firing=false;if(e.button==2){ads=false;$("cross").className=""}});
addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("wheel",e=>{if(state!="play"||paused||P.dead)return;let i=sel;const d=e.deltaY>0?1:-1;for(let n=0;n<7;n++){i=(i+d+7)%7;if(inv[i].own)break}selectSlot(i)});
// ---- ciclo ----
const clk=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);
 if(state=="play"||state=="rules")update(dt);
 fxTick(dt);rec=Math.max(0,rec-dt*8);
 const inG=(state=="play"||state=="rules"||state=="over")&&G&&MP&&MP.k&&PL[P.id]===P;
 if(!inG){yaw+=dt*.12;pitch=-.25;cam.position.set(0,state=="bench"?40:14,0)}else cam.position.set(P.x,P.ey,P.z);
 cam.rotation.set(pitch,yaw,0,"YXZ");
 cam.fov+=((ads&&state=="play"&&sel<NW&&!P.dead?WP[sel].zoom:80)-cam.fov)*Math.min(1,dt*12);cam.updateProjectionMatrix();
 const gs=sel<NW?sel:0,showG=inG&&state!="over"&&!P.dead&&inv.length&&!(ads&&(sel==4||sel==5));
 gun.visible=!!showG;gm.forEach((q,i)=>q.visible=sel<NW&&i==gs);kv.visible=sel==KN;gm[gs].sights.forEach(m=>m.visible=!ads);mz.position.z=MZ[gs];if(sel>=NW)mz.visible=false;
 rtUpd(state=="play"&&ads&&sel>0&&sel<NW&&!P.dead);camoTick(performance.now()/1000);
 gun.position.x+=((ads?0:.22)-gun.position.x)*Math.min(1,dt*14);gun.position.y=(ads?-.17:-.2)+Math.sin(bob)*.012*(ads?.2:1);
 gun.position.z=-.5+rec*.08;gun.rotation.x=rec*.2;kr=Math.max(0,kr-dt*3);kv.position.set(.02,-.1,-.4-kr*.25);kv.rotation.set(-.2-kr*1.1,.15,-.3+kr*.5);
 renderer.render(scene,cam);if(inG&&(state=="play"||state=="rules")&&!paused){drawMM();drawCmp();hud()}})();
zmesh.visible=false;MP=buildMap("conq",Math.random()*1e9|0);mainMenu();

</script></body></html>
